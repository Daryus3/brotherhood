<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>RPG Evren Haritası</title>
    <!-- Harita sistemi için gerekli dosyalar (İnternetten çeker) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Senin haritana özel piksel değerleri
        var genislik = 1799; 
        var yukseklik = 1037; 

        // 2. Harita motorunu başlat (Düz resim ayarı)
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2, // Ne kadar uzaklaşabileceği
            maxZoom: 4   // Ne kadar yakınlaşabileceği
        });

        // 3. harita.png dosyasını sisteme ekle
        var bounds = [[0, 0], [yukseklik, genislik]];
        L.imageOverlay('harita.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // ==========================================
        // 4. İNTERAKTİF PİNLER (İŞARETÇİLER)
        // ==========================================

        // Pin 1: Merkez Krallık Örneği
        var merkezPin = L.marker([550, 850]).addTo(map);

        // Bilgi kutusunun içeriği (Sadece isim ve açıklama kalır)
        merkezPin.bindPopup(`
            <div style="text-align:center;">
                <h3 style="margin:0;">GORDON ŞEHRİ</h3>
                <p style="margin:5px 0 0 0;">TARAFSIZ BÖLGE</p>
            </div>
        `, { autoClose: false, closeOnClick: false });

        // Fare pinin üzerine geldiğinde (mouseover) bilgi sekmesinin otomatik açılması
        merkezPin.on('mouseover', function (e) {
            this.openPopup();
        });

        // Fare pimden uzaklaştığında bilgi sekmesinin kapanması
        merkezPin.on('mouseout', function (e) {
            this.closePopup();
        });

        // Pin noktasına tıklandığı an (click) doğrudan Google Sites sayfasına yönlendirme
        merkezPin.on('click', function (e) {
            window.open('https://sites.google.com/view/brotherhoodrp/harita/gordon', '_blank');
        });

    </script>
</body>
</html>
