<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>RPG Evren Haritası</title>
    <!-- Harita sistemi için gerekli dosyalar[cite: 2] -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; }
        #map { height: 100vh; width: 100vw; }

        /* ==========================================
           ÖZEL POP-UP TASARIMI (CSS)
           ========================================== */
        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 25, 0.92) !important;
            color: #e0e0e0 !important;
            border: 1px solid #d4af37 !important;
            border-radius: 8px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(4px);
        }

        .leaflet-popup-tip {
            background: rgba(20, 20, 25, 0.92) !important;
            border-bottom: 1px solid #d4af37 !important;
            border-right: 1px solid #d4af37 !important;
        }

        .leaflet-popup-content {
            margin: 10px 14px !important;
            line-height: 1.4 !important;
        }

        .popup-title {
            margin: 0;
            color: #f39c12;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
        }

        .popup-subtitle {
            margin: 4px 0 0 0;
            color: #aaa;
            font-size: 12px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Harita piksel değerleri (16384x9421)
        var genislik = 16384; 
        var yukseklik = 9421; 

        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -4,
            maxZoom: 1
        });

        var bounds = [[0, 0], [yukseklik, genislik]];
        L.imageOverlay('harita.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // ==========================================
        // İKON BOYUTUNU VE KONUMUNU AYARLADIĞIMIZ YER
        // ==========================================
        var yMerkez = 5000; // Haritadaki Y koordinatı
        var xMerkez = 7900; // Haritadaki X koordinatı
        
        // 📌 BURADAN BOYUTU DEĞİŞTİREBİLİRSİN: 
        // Sayıyı küçültürsen ikon ufak olur, büyültürsen devleşir.
        var boyut = 300; 

        var iconBounds = [
            [yMerkez - (boyut / 2), xMerkez - (boyut / 2)], 
            [yMerkez + (boyut / 2), xMerkez + (boyut / 2)]
        ]; 

        var sehirIkonuOverlay = L.imageOverlay('city.svg', iconBounds, {
            interactive: true 
        }).addTo(map);

        // ==========================================
        // POP-UP VE ETKİLEŞİMLER
        // ==========================================

        sehirIkonuOverlay.bindPopup(`
            <div style="text-align:center;">
                <h3 class="popup-title">GORDON ŞEHRİ</h3>
                <p class="popup-subtitle">TARAFSIZ BÖLGE</p>
            </div>
        `, { 
            autoClose: false, 
            closeOnClick: false
        });

        sehirIkonuOverlay.on('mouseover', function (e) {
            this.openPopup();
        });

        sehirIkonuOverlay.on('mouseout', function (e) {
            this.closePopup();
        });

        sehirIkonuOverlay.on('click', function (e) {
            window.open('https://sites.google.com/view/brotherhoodrp/harita/gordon', '_blank');
        });

    </script>
</body>
</html>
